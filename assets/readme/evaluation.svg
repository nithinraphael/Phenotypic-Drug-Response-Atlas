<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="evaluation-title evaluation-desc" id="evaluation-root"><title id="evaluation-title">Concentration-held-out evaluation</title><desc id="evaluation-desc">Training and test observations are separated by concentration, model failures are retained and error is aggregated with explicit coverage.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&amp;family=Instrument+Serif&amp;display=swap');
      #evaluation-root { color: #163c3b; font-family: "PT Sans",Arial,sans-serif; }
      #evaluation-root .diagram-container { width:100%;overflow-x:auto }
      #evaluation-root text { font-family:"PT Sans",Arial,sans-serif;fill:#163c3b }
      #evaluation-root .title { font-family:"Instrument Serif",Georgia,serif;font-size:32px }
      #evaluation-root .name { font-size:18px;font-weight:700 }
      #evaluation-root .sub { font-size:14px;fill:#526764 }
      #evaluation-root .note { font-size:15px;fill:#526764 }
      #evaluation-root .zone { font-size:12px;font-weight:700;letter-spacing:1px;fill:#526764 }
      #evaluation-root .node { fill:#fff;stroke:#526764;stroke-width:1.2 }
      #evaluation-root .focal { fill:#e8f2ee;stroke:#176b62;stroke-width:1.5 }
      #evaluation-root .edge { fill:none;stroke:#526764;stroke-width:1.5;marker-end:url(#evaluation-arrow) }
      #evaluation-root .optional { stroke-dasharray:5 4 }</style><marker id="evaluation-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526764"/></marker></defs><rect width="960" height="600" fill="#f6f8f7"/><text x="40" y="52" class="title">Concentration-held-out evaluation</text><text x="40" y="84" class="note">Evaluation predicts concentrations within one observed curve, not unseen drug–cell pairs.</text><path d="M248 192 H304" class="edge"/><path d="M584 192 H672" class="edge"/><path d="M744 240 V280 Q744 288 736 288 H704 Q696 288 696 296 V336" class="edge"/><path d="M824 240 V264 Q824 272 832 272 H840 Q848 272 848 280 V336" class="edge"/><path d="M672 384 H600 Q592 384 592 392 V440 Q592 448 584 448 H536" class="edge"/><path d="M864 432 V536 Q864 544 856 544 H152 Q144 544 144 536 V520" class="edge"/><path d="M280 468 H248" class="edge"/><rect x="40" y="144" width="208" height="96" rx="6" class="node"/><text x="56" y="172" class="name">Measured observations</text><text x="56" y="196" class="sub">One compound, cell, screen</text><text x="56" y="216" class="sub">Positive doses · finite values</text><rect x="304" y="144" width="280" height="96" rx="6" class="node"/><text x="320" y="172" class="name">Group unique concentrations</text><text x="320" y="196" class="sub">Same-dose observations stay together</text><text x="320" y="216" class="sub">Shuffled K-fold · 3 folds · seed 42</text><rect x="672" y="144" width="248" height="96" rx="6" class="node"/><text x="688" y="172" class="name">Partition each fold</text><text x="688" y="196" class="sub">Training examples / held-out doses</text><text x="688" y="216" class="sub">Eligibility checked per model</text><rect x="672" y="336" width="128" height="96" rx="6" class="focal"/><text x="688" y="364" class="name">Fit models</text><text x="688" y="388" class="sub">Training only</text><text x="688" y="408" class="sub">Fit per fold</text><rect x="816" y="336" width="104" height="96" rx="6" class="node"/><text x="832" y="364" class="name">Hold out</text><text x="832" y="388" class="sub">Test doses</text><text x="832" y="408" class="sub">Responses</text><rect x="280" y="416" width="256" height="104" rx="6" class="focal"/><text x="296" y="444" class="name">Predict and retain failures</text><text x="296" y="468" class="sub">Held-out concentrations only</text><text x="296" y="488" class="sub">Missing results remain failures</text><rect x="40" y="416" width="208" height="104" rx="6" class="node"/><text x="56" y="444" class="name">Aggregate error</text><text x="56" y="468" class="sub">Pooled successful RMSE</text><text x="56" y="488" class="sub">Common-observation RMSE</text><text x="40" y="564" class="note">Coverage accompanies error. Two common observations cannot establish model superiority.</text></svg>
