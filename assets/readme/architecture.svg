<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root"><title id="architecture-title">Assay-separated research architecture</title><desc id="architecture-desc">PRISM and BBBC021 use separate analytical workflows, while external records currently supply inventories rather than quantitative validation.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&amp;family=Instrument+Serif&amp;display=swap');
      #architecture-root { color: #163c3b; font-family: "PT Sans",Arial,sans-serif; }
      #architecture-root .diagram-container { width:100%;overflow-x:auto }
      #architecture-root text { font-family:"PT Sans",Arial,sans-serif;fill:#163c3b }
      #architecture-root .title { font-family:"Instrument Serif",Georgia,serif;font-size:32px }
      #architecture-root .name { font-size:18px;font-weight:700 }
      #architecture-root .sub { font-size:14px;fill:#526764 }
      #architecture-root .note { font-size:15px;fill:#526764 }
      #architecture-root .zone { font-size:12px;font-weight:700;letter-spacing:1px;fill:#526764 }
      #architecture-root .node { fill:#fff;stroke:#526764;stroke-width:1.2 }
      #architecture-root .focal { fill:#e8f2ee;stroke:#176b62;stroke-width:1.5 }
      #architecture-root .edge { fill:none;stroke:#526764;stroke-width:1.5;marker-end:url(#architecture-arrow) }
      #architecture-root .optional { stroke-dasharray:5 4 }</style><marker id="architecture-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526764"/></marker></defs><rect width="960" height="600" fill="#f6f8f7"/><text x="40" y="52" class="title">Assay-separated research architecture</text><text x="40" y="84" class="note">Distinct assays share an interface; observations are never treated as paired.</text><text x="40" y="120" class="zone">SOURCE DATA</text><text x="304" y="120" class="zone">ANALYSIS</text><text x="672" y="120" class="zone">RESEARCH INTERFACE</text><path d="M248 192 H304" class="edge"/><path d="M248 320 H304" class="edge"/><path d="M248 448 H304" class="edge"/><path d="M552 192 H600 Q608 192 608 200 V248 Q608 256 616 256 H672" class="edge"/><path d="M552 320 H672" class="edge"/><path d="M552 448 H624 Q632 448 632 440 V392 Q632 384 640 384 H672" class="edge"/><path d="M796 428 V496" class="edge"/><rect x="40" y="144" width="208" height="96" rx="6" class="node"/><text x="56" y="172" class="name">PRISM</text><text x="56" y="196" class="sub">Viability observations</text><text x="56" y="216" class="sub">Source-fitted parameters</text><rect x="304" y="144" width="248" height="96" rx="6" class="node"/><text x="320" y="172" class="name">Viability analysis</text><text x="320" y="196" class="sub">Descriptive screening · LL4</text><text x="320" y="216" class="sub">TabPFN · held-out evaluation</text><rect x="40" y="272" width="208" height="96" rx="6" class="node"/><text x="56" y="300" class="name">BBBC021</text><text x="56" y="324" class="sub">Three-channel images</text><text x="56" y="344" class="sub">Image, dose and well IDs</text><rect x="304" y="272" width="248" height="96" rx="6" class="node"/><text x="320" y="300" class="name">Microscopy analysis</text><text x="320" y="324" class="sub">Pretrained masks · DINO</text><text x="320" y="344" class="sub">Object / field profiles · UMAP</text><rect x="40" y="400" width="208" height="96" rx="6" class="node"/><text x="56" y="428" class="name">GDSC2 / local CTRP</text><text x="56" y="452" class="sub">Separate source records</text><text x="56" y="472" class="sub">Mappings remain unresolved</text><rect x="304" y="400" width="248" height="96" rx="6" class="node"/><text x="320" y="428" class="name">Source inventory</text><text x="320" y="452" class="sub">Identity and provenance</text><text x="320" y="472" class="sub">Quantitative comparison blocked</text><rect x="672" y="212" width="248" height="216" rx="6" class="focal"/><text x="688" y="240" class="name">Public marimo atlas</text><text x="688" y="264" class="sub">Discoveries</text><text x="688" y="284" class="sub">Drug Explorer</text><text x="688" y="304" class="sub">Cell Explorer</text><text x="688" y="324" class="sub">Validation</text><rect x="672" y="496" width="248" height="64" rx="6" class="node"/><text x="688" y="524" class="name">Traceable exports</text><text x="688" y="548" class="sub">Tables · figures · manifests</text><rect x="40" y="520" width="512" height="40" rx="4" fill="#e8eeeb"/><text x="56" y="545" class="note">Across workflows: stable IDs, hashes, exclusions and cache checks</text></svg>
